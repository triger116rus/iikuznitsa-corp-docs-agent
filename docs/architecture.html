<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Архитектура агента</title>
<style>
body{margin:0;background:#fff;font-family:"Segoe UI",Roboto,Arial,sans-serif}
svg{display:block}
.box{fill:#fff;stroke:#c9c9d1;stroke-width:1.5}
.zone{fill:#f6f6f8;stroke:#d9d9df;stroke-width:1.2;stroke-dasharray:6 4}
.llm{fill:#fdecee;stroke:#c8102e;stroke-width:1.5}
.code{fill:#eef4ff;stroke:#1d4fa8;stroke-width:1.5}
.db{fill:#eefaf1;stroke:#1a7f37;stroke-width:1.5}
.mail{fill:#fff6e0;stroke:#9a6700;stroke-width:1.5}
.ops{fill:#f3f0fa;stroke:#5a3e9b;stroke-width:1.5}
.t{font-size:14px;fill:#1d1d1f}.s{font-size:10.5px;fill:#55555c}.h{font-size:13px;font-weight:700;fill:#1d1d1f}
.z{font-size:12px;fill:#6b6b70;font-weight:600}
.ln{stroke:#8a8a93;stroke-width:1.6;fill:none;marker-end:url(#a)}
.ln2{stroke:#c8102e;stroke-width:1.6;fill:none;marker-end:url(#a2)}
</style></head><body>
<svg width="1400" height="880" viewBox="0 0 1400 880">
<defs>
<marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8a8a93"/></marker>
<marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#c8102e"/></marker>
</defs>
<text x="30" y="36" style="font-size:20px;font-weight:700">ИИ-агент по корпоративным регламентам — архитектура</text>
<text x="30" y="58" class="s">2 вызова LLM на вопрос, всё проверяемое — кодом и SQL; модели и данные — в изолированном контуре, внешних API нет</text>

<!-- пользователи и фронт -->
<rect x="30" y="100" width="170" height="92" rx="10" class="box"/><text x="45" y="124" class="h">Пользователи</text>
<text x="45" y="143" class="s">сотрудник — вопросы</text><text x="45" y="158" class="s">СК — письма и ответы</text><text x="45" y="173" class="s">администратор — регламенты</text>
<rect x="30" y="222" width="170" height="70" rx="10" class="box"/><text x="45" y="250" class="h">HTTPS-фронт</text><text x="45" y="270" class="s">Caddy на VPS → SSH-туннель</text>
<rect x="30" y="322" width="170" height="70" rx="10" class="code"/><text x="45" y="350" class="h">Вход и роли</text><text x="45" y="370" class="s">вкладки и действия по роли</text>
<path d="M115 192 L115 220" class="ln"/><path d="M115 292 L115 320" class="ln"/>

<!-- контур -->
<rect x="240" y="80" width="1130" height="780" rx="14" class="zone"/>
<text x="258" y="102" class="z">ИЗОЛИРОВАННЫЙ КОНТУР — сервер 28 vCPU / 48 ГБ, без GPU</text>
<path d="M200 357 L268 170" class="ln"/>

<!-- агентный цикл -->
<text x="270" y="132" class="h">Агентный цикл (FastAPI, app/agent.py)</text>
<g>
<rect x="270" y="145" width="290" height="46" rx="8" class="code"/><text x="282" y="166" class="t">0. Где искать — за 0,1 с</text><text x="282" y="182" class="s">гибридный поиск без LLM → ссылки на пункты</text>
<rect x="270" y="201" width="290" height="56" rx="8" class="code"/><text x="282" y="222" class="t">1. Смысловой кэш</text><text x="282" y="238" class="s">похожесть ≥ 0,95 + сверка фактов: числа, «не»,</text><text x="282" y="251" class="s">подразделение, роль; «Перепроверить» — без кэша</text>
<rect x="270" y="267" width="290" height="46" rx="8" class="llm"/><text x="282" y="288" class="t">2. План (LLM №1)</text><text x="282" y="304" class="s">о правилах ли вопрос; под-запросы</text>
<rect x="270" y="323" width="290" height="46" rx="8" class="code"/><text x="282" y="344" class="t">3. Гибридный поиск</text><text x="282" y="360" class="s">FTS russian + вектор, RRF, rerank; разъяснения СК</text>
<rect x="270" y="379" width="290" height="56" rx="8" class="code"/><text x="282" y="400" class="t">4. Проверки кодом</text><text x="282" y="416" class="s">есть ли близкие пункты? ответ зависит</text><text x="282" y="429" class="s">от подразделения? → уточнение</text>
<rect x="270" y="445" width="290" height="46" rx="8" class="code"/><text x="282" y="466" class="t">5. Обход графа связей</text><text x="282" y="482" class="s">рекурсивный CTE: ссылки, разделы, пробелы базы</text>
<rect x="270" y="501" width="290" height="46" rx="8" class="llm"/><text x="282" y="522" class="t">6. Ответ (LLM №2, поток)</text><text x="282" y="538" class="s">JSON: цитаты → ответ → оговорка → статус</text>
<rect x="270" y="557" width="290" height="70" rx="8" class="code"/><text x="282" y="578" class="t">7. Проверки ответа кодом</text><text x="282" y="594" class="s">цитата — дословно из пункта, иначе не показываем;</text><text x="282" y="607" class="s">числа есть в цитатах; «только / всегда» → оговорка;</text><text x="282" y="620" class="s">полнота перечня → дописываем список дословно</text>
<path d="M415 191 L415 199" class="ln"/><path d="M415 257 L415 265" class="ln"/><path d="M415 313 L415 321" class="ln"/><path d="M415 369 L415 377" class="ln"/><path d="M415 435 L415 443" class="ln"/><path d="M415 491 L415 499" class="ln"/><path d="M415 547 L415 555" class="ln"/>
</g>

<!-- исходы -->
<text x="270" y="660" class="h">Исход</text>
<rect x="270" y="670" width="160" height="72" rx="8" class="box"/><text x="282" y="692" class="t">Ответ</text><text x="282" y="709" class="s">ссылки на пункты, оговорка;</text><text x="282" y="722" class="s">«Также учтите» — соседние</text><text x="282" y="735" class="s">пункты; практика применения</text>
<rect x="440" y="670" width="160" height="72" rx="8" class="box"/><text x="452" y="692" class="t">Уточнение</text><text x="452" y="709" class="s">«О каком подразделении?»,</text><text x="452" y="722" class="s">«все варианты»; ≤ 2 раз;</text><text x="452" y="735" class="s">берёт из учётной записи</text>
<rect x="610" y="670" width="190" height="72" rx="8" class="mail"/><text x="622" y="692" class="t">Письмо в службу качества</text><text x="622" y="709" class="s">нет ответа — не выдумываем;</text><text x="622" y="722" class="s">сотрудник в копии; ответ —</text><text x="622" y="735" class="s">уведомлением на почту</text>
<rect x="810" y="670" width="160" height="72" rx="8" class="box"/><text x="822" y="692" class="t">Вне регламентов</text><text x="822" y="709" class="s">премия, курс валют →</text><text x="822" y="722" class="s">«к руководителю»;</text><text x="822" y="735" class="s">«смени роль», задачи — отказ</text>
<path d="M415 627 L415 668" class="ln"/>

<!-- модели -->
<text x="600" y="132" class="h">Локальные модели (llama.cpp)</text>
<rect x="600" y="145" width="280" height="58" rx="8" class="llm"/><text x="612" y="168" class="t">Qwen3-30B-A3B Q4_K_M</text><text x="612" y="186" class="s">план и ответ; 2 слота, кэш промпта; Apache 2.0</text>
<rect x="600" y="213" width="280" height="58" rx="8" class="llm"/><text x="612" y="236" class="t">bge-m3 Q8_0</text><text x="612" y="254" class="s">эмбеддинги пунктов и вопросов; MIT</text>
<path d="M560 290 L598 180" class="ln2"/><path d="M560 524 L598 192" class="ln2"/><path d="M560 228 L598 245" class="ln2"/>

<!-- БД -->
<text x="600" y="306" class="h">PostgreSQL 16 + pgvector + pg_trgm</text>
<rect x="600" y="319" width="280" height="216" rx="8" class="db"/>
<text x="612" y="342" class="t">documents</text><text x="692" y="342" class="s">регламенты, редакции, отдел</text>
<text x="612" y="366" class="t">chunks</text><text x="692" y="366" class="s">пункты: текст, FTS, вектор</text>
<text x="612" y="390" class="t">doc_links</text><text x="692" y="390" class="s">граф связей (см. справа)</text>
<text x="612" y="414" class="t">kb_answers</text><text x="692" y="414" class="s">разъяснения службы качества</text>
<text x="612" y="438" class="t">tickets</text><text x="692" y="438" class="s">письма в СК, сроки, подтверждение</text>
<text x="612" y="462" class="t">dialogs</text><text x="692" y="462" class="s">уточнения в диалоге</text>
<text x="612" y="486" class="t">users</text><text x="692" y="486" class="s">учётные записи, роль, подразделение</text>
<text x="612" y="510" class="t">query_log</text><text x="692" y="510" class="s">шаги, токены, время, вектор вопроса</text>
<path d="M560 346 L598 366" class="ln"/><path d="M560 468 L598 392" class="ln"/>

<!-- граф -->
<text x="910" y="132" class="h">Граф связей (строится при загрузке)</text>
<rect x="910" y="145" width="430" height="230" rx="8" class="box"/>
<circle cx="955" cy="195" r="11" fill="#c8102e"/><text x="973" y="199" class="s">Регламент ИБ</text>
<circle cx="955" cy="255" r="11" fill="#1d6fd1"/><text x="973" y="259" class="s">Регламент ДБРЦТ</text>
<circle cx="955" cy="315" r="11" fill="#1a7f37"/><text x="973" y="319" class="s">Регламент Тех. дирекции</text>
<rect x="1110" y="182" width="44" height="24" rx="12" fill="#f0f0f3" stroke="#aaa"/><text x="1121" y="199" class="s" style="font-weight:700">РП</text>
<rect x="1110" y="242" width="44" height="24" rx="12" fill="#f0f0f3" stroke="#aaa"/><text x="1122" y="259" class="s" style="font-weight:700">SS</text>
<rect x="1240" y="290" width="14" height="22" fill="#fff" stroke="#5a3e9b" stroke-dasharray="3 2"/><text x="1110" y="330" class="s" style="fill:#5a3e9b">«Арбитраж расчёта себестоимости» —</text><text x="1110" y="344" class="s" style="fill:#5a3e9b">документа нет в базе (пробел)</text>
<path d="M1060 195 L1108 194" class="ln"/><path d="M1060 199 L1108 252" class="ln"/><path d="M1060 256 L1108 196" class="ln"/><path d="M1100 320 L1238 302" style="stroke:#5a3e9b;stroke-width:1.6;fill:none;marker-end:url(#a)"/>
<text x="925" y="362" class="s">рёбра: ссылки пунктов · роли · редакции · разъяснение СК → пункт</text>

<!-- почта -->
<text x="910" y="406" class="h">Служба качества (почта)</text>
<rect x="910" y="419" width="430" height="150" rx="8" class="mail"/>
<text x="924" y="442" class="t">SMTP: письмо в службу качества, сотрудник в копии</text>
<text x="924" y="464" class="t">«Ответить всем» из обычной почты</text>
<text x="924" y="486" class="t">IMAP: агент забирает ответ → kb_answers + ребро</text>
<text x="924" y="506" class="s">ответ владельца процесса — после «Подтверждаю»; «Отозвать»</text>
<text x="924" y="522" class="s">сотрудник получает уведомление об ответе на почту</text>
<text x="924" y="538" class="s">разъяснение против регламента → регламент важнее, оговорка</text>
<text x="924" y="554" class="s">контроль срока ответа; следующий такой вопрос — «Практика применения»</text>
<path d="M800 706 L908 560" class="ln"/><path d="M908 486 L882 430" class="ln"/>

<!-- эксплуатация -->
<text x="990" y="600" class="h">Эксплуатация (docs/OPERATIONS.md)</text>
<rect x="990" y="613" width="350" height="130" rx="8" class="ops"/>
<text x="1002" y="636" class="t" style="font-size:12.5px">Загрузка DOCX и новых редакций (админ)</text>
<text x="1002" y="658" class="t" style="font-size:12.5px">Аналитика: токены, время p50 / p95, узкие места</text>
<text x="1002" y="680" class="t" style="font-size:12.5px">Резервные копии: БД + файлы, ежедневно 03:30</text>
<text x="1002" y="702" class="t" style="font-size:12.5px">Диагностическая выгрузка с обезличиванием</text>
<text x="1002" y="722" class="s">тексты регламентов, ответов и писем наружу не выгружаются</text>
<text x="1002" y="736" class="s">ФИО, почта, телефоны, суммы, номера — маскируются</text>

<text x="270" y="800" class="s">Проверка качества: 40 своих контрольных вопросов + 30 слепых (не видели при разработке) — ответ, уточнение, нет в регламентах,</text>
<text x="270" y="815" class="s">вне темы, синонимы ролей, английский, ловушки; тест ролей; выдуманных ответов — 0 (eval/run_eval.py)</text>
</svg></body></html>
